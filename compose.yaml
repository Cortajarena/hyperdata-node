x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
      tag: "{{.Name}}"

# ─── Volume conventions ────────────────────────────────────────────────
# We mount the ENTIRE /home/hluser/hl/ tree to ${DATA_DIR}/hl-node-data/
# on the host so EVERY byte hl-visor writes lands on NVMe — not just the
# data dir but also tmp/ (shell-out scratch), hyperliquid_data/ (visor
# internal state), and anything else hl-visor might add later.
#
# Host: ${DATA_DIR}/hl-node-data/  ←→  Container: /home/hluser/hl/
#
# Layout that emerges under hl-node-data/:
#   data/periodic_abci_states/<date>/<height>.rmp   ← snapshots
#   data/node_fills/hourly/<date>/<hour>            ← API fills (tmpfs-overlaid)
#   data/node_order_statuses/hourly/<date>/<hour>   ← per-order L4 events
#   data/node_raw_book_diffs/hourly/<date>/<hour>   ← per-event L4 book deltas
#   data/replica_cmds/<session>/<date>/<height>     ← chain replay log
#   tmp/shell_rs_out/...                            ← visor shell-out scratch
#   hyperliquid_data/visor_abci_state.json          ← visor internal state
# ───────────────────────────────────────────────────────────────────────

services:
  # ─── LIVE — long-running non-validator, P2P-connected ──────────────
  # Produces four output streams locally (see run_live.sh for flag set).
  # The tmpfs at /mnt/hl_node_fills is mounted over node_fills/ so the
  # latency-critical trade stream lands in RAM; the other outputs go to
  # NVMe under hl-node-data/.
  hyperdata-node-live:
    <<: *logging
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: host
    cpuset: "0-7"
    mem_limit: 24g
    volumes:
      - ${DATA_DIR}/hl-node-data:/home/hluser/hl
      - /mnt/hl_node_fills:/home/hluser/hl/data/node_fills
      - ./visor.json:/usr/local/bin/visor.json:ro
      - ./override_gossip_config_live.json:/home/hluser/override_gossip_config.json:ro
    command: ["./scripts/run_live.sh"]

  # ─── PRUNER — daily cron (03:00 UTC) that rm's files >48h under
  # /home/hluser/hl/data/, preserving visor_child_stderr/ for crash
  # debugging. Built directly from HL's upstream pruner/ subdir (debian
  # + cron + bash; no hl-visor binary involved).
  # Pin to a commit if upstream churn becomes a problem.
  hyperdata-node-pruner:
    <<: *logging
    build:
      context: https://github.com/hyperliquid-dex/node.git#main:pruner
    restart: unless-stopped
    volumes:
      - ${DATA_DIR}/hl-node-data/data:/home/hluser/hl/data
